name: Stage157 source-backed large Rhea liquidation Sandbox search
on:
  pull_request:
    paths:
      - 'scripts/stage157-large-source-liquidation-gate.mjs'
      - 'scripts/stage157-large-source-candidates.mjs'
      - 'tests/rhea-stage157-large-source-liquidation-gate.test.mjs'
      - 'src/rhea/stage38-live-candidate-pipeline.ts'
      - 'src/rhea/stage35-atomic-reference-sizing.ts'
      - 'tests/rhea-stage35-reference-sizing.test.mjs'
      - 'src/rhea/stage38-live-candidate-cli.ts'
      - 'tests/rhea-stage38-live-candidate-pipeline.test.mjs'
      - 'scripts/stage164-source-pricing-closure.mjs'
      - 'scripts/stage89-targeted-wnear-clone.mjs'
      - 'tests/rhea-stage89-targeted-wnear-clone.test.mjs'
      - 'scripts/stage119-clone-failure.mjs'
      - 'tests/rhea-stage119-clone-failure.test.mjs'
      - 'src/rhea/stage37-sandbox-liquidation.ts'
      - 'tests/rhea-stage37-sandbox-execution.test.mjs'
      - 'scripts/stage37-workspaces-sandbox-replay.mjs'
      - 'tests/rhea-stage164-pricing-closure.test.mjs'
      - '.github/workflows/rhea-stage157-large-liquidation-sandbox.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage157-large-source-liquidation-gate.mjs'
      - 'scripts/stage157-large-source-candidates.mjs'
      - 'tests/rhea-stage157-large-source-liquidation-gate.test.mjs'
      - 'src/rhea/stage38-live-candidate-pipeline.ts'
      - 'src/rhea/stage35-atomic-reference-sizing.ts'
      - 'tests/rhea-stage35-reference-sizing.test.mjs'
      - 'src/rhea/stage38-live-candidate-cli.ts'
      - 'tests/rhea-stage38-live-candidate-pipeline.test.mjs'
      - 'scripts/stage164-source-pricing-closure.mjs'
      - 'scripts/stage89-targeted-wnear-clone.mjs'
      - 'tests/rhea-stage89-targeted-wnear-clone.test.mjs'
      - 'scripts/stage119-clone-failure.mjs'
      - 'tests/rhea-stage119-clone-failure.test.mjs'
      - 'src/rhea/stage37-sandbox-liquidation.ts'
      - 'tests/rhea-stage37-sandbox-execution.test.mjs'
      - 'scripts/stage37-workspaces-sandbox-replay.mjs'
      - 'tests/rhea-stage164-pricing-closure.test.mjs'
      - '.github/workflows/rhea-stage157-large-liquidation-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arbivane-stage157-large-source-local-only
  cancel-in-progress: false
jobs:
  source_gate_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          set -euo pipefail
          node --check scripts/stage157-large-source-liquidation-gate.mjs
          node --check scripts/stage164-source-pricing-closure.mjs
          node --check scripts/stage89-targeted-wnear-clone.mjs
          node --experimental-strip-types --test tests/rhea-stage157-large-source-liquidation-gate.test.mjs tests/rhea-stage38-live-candidate-pipeline.test.mjs tests/rhea-stage164-pricing-closure.test.mjs tests/rhea-stage37-sandbox-execution.test.mjs tests/rhea-stage89-targeted-wnear-clone.test.mjs tests/rhea-stage119-clone-failure.test.mjs
  source_attested_large_candidates:
    if: github.event_name != 'pull_request'
    needs: source_gate_regression
    strategy:
      fail-fast: false
      max-parallel: 2
      # 62 genuine historical LiNEAR debt findings across these four ranges
      # (19 + 16 + 14 + 13), versus 10 in the previous four windows.
      # Historic debt presence does NOT imply a current liquidation.
      matrix:
        include:
          - {shard: 0, from: 2537}
          - {shard: 1, from: 4989}
          - {shard: 2, from: 7671}
          - {shard: 3, from: 2986}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXECUTION_ENABLED: 'false'
      NEAR_NETWORK: mainnet
      NEAR_WORKSPACES_NETWORK: sandbox
      NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
      NEAR_RPC_FALLBACK_URL: https://rpc.mainnet.near.org
      RHEA_LENDING_CONTRACT: contract.main.burrow.near
      RHEA_ORACLE_CONTRACT: aggregate-oracle.near
      RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
      RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
      RHEA_STAGE32_VERIFIED_INDEX_PATH: source/rhea-full-paged-index.json
      RHEA_STAGE32_MAX_FINDINGS: '80'
      RHEA_STAGE32_BATCH_SIZE: '20'
      RHEA_STAGE32_CONCURRENCY: '1'
      RHEA_STAGE32_RESUME: 'false'
      RHEA_STAGE32_CHECKPOINT_PATH: stage32-reprice-checkpoint.json
      RHEA_STAGE32_REPORT_PATH: stage32-reprice-report.json
      RHEA_STAGE38_SOURCE_RUN: '40128285853'
      RHEA_STAGE38_SOURCE_FILE: source/rhea-full-paged-index.json
      RHEA_STAGE38_STAGE32_REPORT_FILE: stage32-reprice-report.json
      RHEA_STAGE38_MAX_FINDINGS: '80'
      RHEA_STAGE38_SANDBOX_MIN_PAPER_GROSS_USD_E27: '1'
      # Stage159: never select higher-gross unsupported WNEAR proposals over LiNEAR.
      STAGE157_REQUIRED_ROUTE: linear-protocol.near
      STAGE157_STAGE38_EVIDENCE: stage38-qualification.json
      STAGE157_REPORT: stage157-large-source-admission.json
      # Stage163 reduces provider pressure across parallel jobs; no relaxed oracle rules.
      RHEA_RPC_SPACING_MS: '1600'
      RHEA_STAGE38_CONCURRENCY: '1'
      RHEA_STAGE38_MAX_RECOVERY_ATTEMPTS: '40'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Retrieve complete source-verified debt registry, no invented debt
        uses: actions/download-artifact@v4
        with:
          run-id: '40128285853'
          name: rhea-full-paged-verified-market
          github-token: ${{ github.token }}
          path: source
      - name: Prove source registry and choose bounded fresh-recheck window
        env:
          FROM: ${{ matrix.from }}
        run: |
          set -euo pipefail
          jq -e '.mode == "RHEA_COMPLETE_PAGED_INDEX_ATTESTATION"
            and .chain == "NEAR_MAINNET"
            and .completeSnapshot == true
            and .debtAccounts == 7801
            and (.findings | length) == 7801
            and .zeroSchemaErrors == true' source/rhea-full-paged-index.json
          echo "RHEA_STAGE32_START_FINDING=$FROM" >> "$GITHUB_ENV"
          echo "RHEA_STAGE38_START_FINDING=$FROM" >> "$GITHUB_ENV"
          echo "Stage157 shard ${{ matrix.shard }}: historical debt indexes $FROM–$((FROM+79)). Prices, debt and rules are rechecked at a fresh pinned final block." >> "$GITHUB_STEP_SUMMARY"
      - name: Read-only fresh debt and oracle risk recheck
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/full-active-pyth-sweep-cli.ts > stage157-risk-summary.json
          jq -e '.mode == "RHEA_STAGE32_RESUMABLE_PYTH_REPRICE_SWEEP"
            and .executionEnabled == false and .maySign == false and .mayBroadcast == false
            and .processed == 80
            and .processed == (.paperAtRisk+.paperHealthy+.noDebtNow+.blocked)' stage157-risk-summary.json
      - name: Source-sized live-pinned liquidation classification, any positive amount
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage38-live-candidate-cli.ts > stage157-source-summary.json
          jq -e '.mainnetExecutionEnabled == false and .maySignMainnet == false
            and .mayBroadcastMainnet == false and .netProfitVerified == false
            and .reviewed == 80 and .refreshed == .paperAtRiskFromPreviousScan' stage157-source-summary.json
          node scripts/stage157-large-source-liquidation-gate.mjs > stage157-gate-summary.json
          jq -e '.mainnetExecutionEnabled == false and .maySignMainnet == false
            and .mayBroadcastMainnet == false and .realizedNetEconomicProfitVerified == false' stage157-large-source-admission.json
          jq -c '{refreshed,positiveSourcePlans,rejectedByRequiredRoute,failedFreshReads,
            recoveryDeferredFindings,recoveryBudgetExhausted,boundedRecoveryAttempts}' \
            stage38-qualification.json >> "$GITHUB_STEP_SUMMARY"
          jq -c '{status,canAttemptSandbox,sourceBorrower,referenceRepayUsdE27,
             referenceGrossUsdE27,blockers}' stage157-large-source-admission.json >> "$GITHUB_STEP_SUMMARY"
      - name: Execute actual imported Rhea Workspaces liquidation only if source-qualified
        if: success()
        env:
          SANDBOX_ARTIFACT_URL: https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.13.4/near-sandbox.tar.gz
          STAGE45_ARCHIVAL_FALLBACK_URL: ${{ secrets.ARBIVANE_LARGE_STATE_ARCHIVAL_RPC_URL || 'https://archival-rpc.mainnet.near.org' }}
        run: |
          set -euo pipefail
          if ! jq -e '.canAttemptSandbox == true and .status == "ELIGIBLE_FOR_SOURCE_PINNED_LOCAL_SANDBOX_REPLAY_ONLY"' stage157-large-source-admission.json > /dev/null; then
            echo 'No eligible source-sized liquidation. No contract transaction submitted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s stage38-positive-stage35-evidence.json
          jq -s -e '.[0].sourceBorrower == .[1].borrowerAccountId
            and .[0].sourceBlockHeight == .[1].blockHeight
            and .[0].referenceGrossUsdE27 == .[1].paperGrossUsdE27
            and .[1].referenceRulesPass == true
            and .[1].maySign == false and .[1].mayBroadcast == false' \
            stage157-large-source-admission.json stage38-positive-stage35-evidence.json
          npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
          export STAGE37_ALLOW_SANDBOX_MUTATION=true
          export STAGE49_ALLOW_SANDBOX_WRAP_NEAR_FUNDING=true
          export STAGE37_STAGE35_EVIDENCE_PATH=stage38-positive-stage35-evidence.json
          export NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com
          export NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com
          # A failed real Sandbox replay is FAILURE, never a profitable trade.
          node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage157-sandbox-runner.json
          jq -e '.chain == "NEAR_SANDBOX" and .realMainnetExecuted == false
            and .mayBroadcastMainnet == false' stage157-sandbox-runner.json
          echo 'Sandbox replay completed: inspect original FINAL receipts, debt deltas and fees; mainnet untouched.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve original source, admission, Sandbox receipts and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage157-large-source-search-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            stage157-risk-summary.json
            stage32-reprice-report.json
            stage32-reprice-checkpoint.json
            stage157-source-summary.json
            stage38-qualification.json
            stage38-positive-stage35-evidence.json
            stage157-gate-summary.json
            stage157-large-source-admission.json
            stage157-sandbox-runner.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
            stage55-sandbox-phase-evidence.json
            stage49-sandbox-funding.json
            stage51-active-pyth-sandbox-parity.json
            stage164-derived-price-parity.json
            stage167-pinned-derived-price-diagnostics.json
            stage88-sandbox-clone-witness.json
