name: Bounded authentic Rhea Sandbox liquidation recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: arbivane-stage63-authentic-recovery
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      stop: ${{ steps.plan.outputs.stop }}
      attempt: ${{ steps.plan.outputs.attempt }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        name: Restore bounded cursor from completed workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rhea-stage63-bounded-recovery.yml/runs?status=completed&per_page=100")
          attempts=$(jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length' <<<"$runs")
          successes=$(jq '[.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .conclusion == "success")] | length' <<<"$runs")
          [[ "$attempts" =~ ^[0-9]+$ && "$successes" =~ ^[0-9]+$ ]]
          echo "attempt=$attempts" >> "$GITHUB_OUTPUT"
          if (( successes > 0 || attempts >= 18 )); then
            echo 'stop=true' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "Recovery stopped: verified success count=$successes, completed attempt budget=$attempts/18." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'stop=false' >> "$GITHUB_OUTPUT"
          if (( attempts == 0 )); then
            # Scan the never-covered 109-account registry tail first.
            matrix='{"include":[{"shard":0,"start":7692,"count":80},{"shard":1,"start":7772,"count":29}]}'
          else
            # Then continue disjointly from the last reconciled cursor 2252.
            base=$((2252+(attempts-1)*320))
            # Stage65: independently reprice four AUTHENTIC source-registry
            # positions whose prior fresh sizing failed under the old fixed
            # 75-bps haircut. Shards 4..7 are deliberately rechecks, not
            # additional disjoint coverage. A fresh paper-risk classification
            # and ALL source rules are still mandatory before Sandbox.
            # Bound rechecks to four follow-up attempts; no infinite churn.
            matrix=$(jq -cn --argjson b "$base" --argjson a "$attempts" '
              {include:(
                [range(0;4) as $s | {shard:$s,start:($b+$s*80),count:80}] +
                (if ($a >= 4 and $a <= 7) then
                  [2579,2594,3116,3147] | to_entries |
                  map({shard:(.key+4),start:.value,count:1})
                 else [] end)
              )}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Authentic recovery attempt $((attempts+1))/18; matrix: $matrix" >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: gate
    if: needs.gate.outputs.stop != 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Download immutable authenticated 7,801-account debt registry
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: '40128285853'
          github-token: ${{ github.token }}
          path: source
      - name: Validate unique source cursor and bounded resource allocation
        env:
          START: ${{ matrix.start }}
          COUNT: ${{ matrix.count }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          jq -e '.mode == "RHEA_COMPLETE_PAGED_INDEX_ATTESTATION" and .completeSnapshot == true and .debtAccounts == 7801 and (.findings | length) == 7801' source/rhea-full-paged-index.json
          [[ "$START" =~ ^[0-9]+$ && "$COUNT" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]]
          (( COUNT >= 1 && COUNT <= 80 && START >= 2252 && START+COUNT <= 7801 ))
          jq -n --argjson attempt "$ATTEMPT" --argjson shard "$SHARD" --argjson start "$START" --argjson count "$COUNT" \
            '{mode:"ARBIVANE_STAGE63_BOUNDED_CURSOR",attempt:$attempt,shard:$shard,startFinding:$start,findingCount:$count}' > stage63-cursor.json
          echo "RHEA_STAGE32_START_FINDING=$START" >> "$GITHUB_ENV"
          echo "RHEA_STAGE38_START_FINDING=$START" >> "$GITHUB_ENV"
          echo "RHEA_STAGE32_MAX_FINDINGS=$COUNT" >> "$GITHUB_ENV"
          echo "RHEA_STAGE38_MAX_FINDINGS=$COUNT" >> "$GITHUB_ENV"
      - name: Refresh source-authenticated borrowers with paced final-block Pyth reads
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          NEAR_RPC_FALLBACK_URL: https://rpc.mainnet.near.org
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE32_VERIFIED_INDEX_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE32_BATCH_SIZE: '20'
          RHEA_STAGE32_CONCURRENCY: '2'
          RHEA_RPC_SPACING_MS: '700'
          RHEA_STAGE32_RESUME: 'false'
          RHEA_STAGE32_CHECKPOINT_PATH: stage32-reprice-checkpoint.json
          RHEA_STAGE32_REPORT_PATH: stage32-reprice-report.json
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/full-active-pyth-sweep-cli.ts > stage63-sweep-summary.json
          jq -e --argjson count '${{ matrix.count }}' '.executionEnabled == false and .processed == $count and .processed == (.paperAtRisk+.paperHealthy+.noDebtNow+.blocked)' stage63-sweep-summary.json
      - name: Fresh-size risk, verify liquidity and execute real Workspaces call when eligible
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          NEAR_RPC_FALLBACK_URL: https://rpc.mainnet.near.org
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE38_SOURCE_RUN: '40128285853'
          RHEA_STAGE38_SOURCE_FILE: source/rhea-full-paged-index.json
          RHEA_STAGE38_STAGE32_REPORT_FILE: stage32-reprice-report.json
          RHEA_RPC_SPACING_MS: '700'
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage38-live-candidate-cli.ts > stage63-qualification-summary.json
          jq -e --argjson count '${{ matrix.count }}' '.mainnetExecutionEnabled == false and .maySignMainnet == false and .mayBroadcastMainnet == false and .reviewed == $count and .refreshed == .paperAtRiskFromPreviousScan and .status != "BLOCKED_CANDIDATE_LIMIT"' stage63-qualification-summary.json
          jq -c '{startFinding,nextFinding,paperAtRiskFromPreviousScan,positiveSourcePlans,failedFreshReads,boundedRecoveryAttempts,recoveredRateLimitedFindings,blockedReasonCounts,sizingStatusCounts,sizingBlockerCounts}' stage63-qualification-summary.json
          if jq -e '.sandboxPlanReady == true' stage63-qualification-summary.json >/dev/null; then
            test -s stage38-positive-stage35-evidence.json
            npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
            sandbox_exit=0
            if EXECUTION_ENABLED=false NEAR_WORKSPACES_NETWORK=sandbox STAGE37_ALLOW_SANDBOX_MUTATION=true STAGE49_ALLOW_SANDBOX_WRAP_NEAR_FUNDING=true \
              STAGE37_STAGE35_EVIDENCE_PATH=stage38-positive-stage35-evidence.json \
              NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com \
              NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com \
              node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage63-sandbox-actual.json; then
              sandbox_exit=0
            else
              sandbox_exit=$?
            fi
            EXECUTION_ENABLED=false NEAR_NETWORK=mainnet node scripts/stage56-sandbox-attempt-cli.mjs "$sandbox_exit" \
              stage63-sandbox-actual.json stage55-sandbox-phase-evidence.json \
              stage37-sandbox-execution.json stage41-sandbox-balance-settlement.json \
              > stage63-sandbox-attempt-stdout.json
            jq -e '.mode == "ARBIVANE_STAGE56_EVIDENCED_SANDBOX_ATTEMPT" and .chain == "NEAR_SANDBOX" and .realMainnetExecuted == false and .maySignMainnet == false and .mayBroadcastMainnet == false' stage56-sandbox-attempt-evidence.json
            jq -c '{status,currentPhase,observedFailureCode,localLiquidationCallInvoked,actualRheaSettlementVerified}' stage56-sandbox-attempt-evidence.json
          fi
      - name: Preserve cursor, reads, call receipts and settlement balances
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-stage63-attempt-${{ needs.gate.outputs.attempt }}-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: error
          path: |
            stage63-cursor.json
            stage32-reprice-checkpoint.json
            stage32-reprice-report.json
            stage63-sweep-summary.json
            stage38-qualification.json
            stage63-qualification-summary.json
            stage38-positive-stage35-evidence.json
            stage63-sandbox-actual.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
            stage46-sandbox-clone-evidence.json
            stage49-sandbox-route-preflight.json
            stage49-sandbox-registration.json
            stage49-sandbox-funding.json
            stage50-pinned-repay-reserve.json
            stage51-active-pyth-sandbox-parity.json
            stage52-actor-borrow-capacity.json
            stage55-sandbox-phase-evidence.json
            stage56-sandbox-attempt-evidence.json
            stage63-sandbox-attempt-stdout.json

  verify:
    needs: [gate, scan]
    if: always() && needs.gate.outputs.stop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rhea-stage63-attempt-${{ needs.gate.outputs.attempt }}-shard-*
          path: evidence
      - name: Require receipts plus independently reconciled debt, collateral and FT deltas
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
        run: |
          set -euo pipefail
          success=''
          while IFS= read -r phase; do
            dir=$(dirname "$phase")
            settlement="$dir/stage41-sandbox-balance-settlement.json"
            receipt="$dir/stage37-sandbox-execution.json"
            proposal="$dir/stage38-positive-stage35-evidence.json"
            test -s "$settlement" -a -s "$receipt" -a -s "$proposal" || continue
            if jq -e '.status == "LOCAL_RHEA_BALANCE_AND_CALLBACK_VERIFIED_NOT_PROFIT" and .localLiquidationCallInvoked == true and .actualRheaSettlementVerified == true' "$phase" >/dev/null && \
               jq -e '.status == "ISOLATED_CALLBACK_SUCCESS_NOT_MAINNET_PROOF" and .attemptedTransaction == true and .failedReceiptCount == 0 and .callbackReceiptCount > 0 and .failedCallbackReceiptCount == 0' "$receipt" >/dev/null && \
               jq -e '.status == "POSITION_AND_FT_DELTAS_OBSERVED_UNSOLD" and .borrowerMutationVerified == true and .assetTransferObserved == true and .callbackSuccessObserved == true and .borrowerDebtDecreaseInternal != "0" and .borrowerCollateralDecreaseInternal != "0" and .actorSeizeFtIncreaseAtomic != "0"' "$settlement" >/dev/null; then
              success="$dir"
              break
            fi
          done < <(find evidence -name stage55-sandbox-phase-evidence.json -type f -print | sort)
          if [[ -n "$success" ]]; then
            mkdir -p verified
            cp "$success"/stage{37-sandbox-execution,41-sandbox-balance-settlement,55-sandbox-phase-evidence}.json verified/
            cp "$success"/stage38-positive-stage35-evidence.json verified/
            jq -n --slurpfile proposal "$success/stage38-positive-stage35-evidence.json" \
              --slurpfile receipt "$success/stage37-sandbox-execution.json" \
              --slurpfile settlement "$success/stage41-sandbox-balance-settlement.json" \
              --arg sourceRun '40128285853' --arg workflowRun "$GITHUB_RUN_ID" \
              '{mode:"ARBIVANE_VERIFIED_RHEA_SANDBOX_LIQUIDATION",sourceRegistryRun:$sourceRun,workflowRun:$workflowRun,borrower:$proposal[0].borrowerAccountId,assetPair:{repay:$proposal[0].repay.tokenId,seize:$proposal[0].seize.tokenId},sourceBlock:$proposal[0].blockHeight,transaction:$receipt[0],settlement:$settlement[0]}' > verified/execution-evidence.json
            jq -c '{borrower,assetPair,sourceBlock,workflowRun,transaction:{status:.transaction.status,receiptCount:.transaction.receiptCount,callbackReceiptCount:.transaction.callbackReceiptCount,gasBurntGasUnits:.transaction.gasBurntGasUnits},settlement:{borrowerDebtDecreaseInternal:.settlement.borrowerDebtDecreaseInternal,borrowerCollateralDecreaseInternal:.settlement.borrowerCollateralDecreaseInternal,actorSeizeFtIncreaseAtomic:.settlement.actorSeizeFtIncreaseAtomic}}' verified/execution-evidence.json
            exit 0
          fi
          if (( ATTEMPT + 1 < 18 )); then
            gh workflow run rhea-stage63-bounded-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
          echo "No verified liquidation in bounded attempt $((ATTEMPT+1))/18; next disjoint cursor queued when budget remains." >&2
          exit 1
      - name: Preserve terminal verified execution evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-verified-sandbox-liquidation
          path: verified
          retention-days: 90
          if-no-files-found: error
