name: NEAR Rhea Stage28 configured oracle value check (read only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rhea/configured-oracle-valuation.ts'
      - 'src/rhea/configured-oracle-valuation-cli.ts'
      - 'tests/rhea-stage28-configured-oracle-valuation.test.mjs'
      - '.github/workflows/rhea-stage28-configured-oracle-valuation.yml'
  push:
    branches: [main]
    paths:
      - 'src/rhea/configured-oracle-valuation.ts'
      - 'src/rhea/configured-oracle-valuation-cli.ts'
      - '.github/workflows/rhea-stage28-configured-oracle-valuation.yml'
permissions:
  contents: read
jobs:
  configured-oracle-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Query configured oracle and borrower at the same finalized NEAR block
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_CONFIGURED_ORACLE: priceoracle.near
          RHEA_BORROWER_ACCOUNT_ID: tmp-owner.main.burrow.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_CONFIGURED_ORACLE_CODE_HASH: 4sUttxKK4gJpWr1mhfNddBt497ZiXsRMbTYvCeQQbjR2
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/configured-oracle-valuation-cli.ts > stage28-configured-oracle.json
          jq -e '.chain == "NEAR_MAINNET" and .mode == "RHEA_STAGE28_CONFIGURED_ORACLE_PRICE_DENOMINATION" and .executionEnabled == false and .maySign == false and .mayBroadcast == false and .fullStateReplayPerformed == false and .profitVerified == false and .currentExecutionOracleBranchAttested == false and (.status | IN("NO_DEBT", "CONFIGURED_ORACLE_QUOTES_UNAVAILABLE", "REFERENCE_VALUE_RECONCILED_UNAPPROVED", "INCOMPLETE_REFERENCE_VALUATION"))' stage28-configured-oracle.json
      - name: State limits
        if: always()
        run: |
          echo 'Configured oracle get_price_data can differ from actual execute_with_pyth price branch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A matching reference price scale is never sufficient for real liquidation execution or net profitability.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-stage28-configured-oracle-valuation
          path: stage28-configured-oracle.json
          if-no-files-found: warn
          retention-days: 7
