name: NEAR Rhea liquidation route and unsigned preview (read only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rhea/liquidation-transaction-preview.ts'
      - 'src/rhea/liquidation-route-cli.ts'
      - 'src/rhea/deployed-wasm-witness.ts'
      - '.github/workflows/rhea-stage25-liquidation-route.yml'
  push:
    branches: [main]
    paths:
      - 'src/rhea/liquidation-transaction-preview.ts'
      - 'src/rhea/liquidation-route-cli.ts'
      - '.github/workflows/rhea-stage25-liquidation-route.yml'
permissions:
  contents: read
jobs:
  confirm-oracle-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check fresh deployed lending + configured oracle exported entrypoints
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/liquidation-route-cli.ts > stage25-live-route.json
          jq -e '.route.lendingExecuteExportObserved == true and .route.configuredOracleCallExportObserved == true and .route.deployedSourceParityVerified == false and .route.transactionReplayed == false and .route.executionEnabled == false and .route.mayBroadcast == false and .proposedTransactions == 0' stage25-live-route.json
      - name: Preserve unresolved live-money blockers
        if: always()
        run: |
          echo 'Observed exported execute and oracle_call names are NOT proof of liquidation validity, financing, code parity, or profit.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run has no wallet, no signing, no transfer, and no live liquidation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-rhea-stage25-oracle-route-readonly
          path: stage25-live-route.json
          if-no-files-found: warn
          retention-days: 7
