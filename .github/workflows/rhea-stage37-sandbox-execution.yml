name: Stage37 isolated Rhea Sandbox liquidation execution gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rhea-stage37-sandbox-execution.yml'
  workflow_dispatch:
    inputs:
      stage35_run_id:
        description: 'Actions run with a positive valid Stage35 reference sizing artifact'
        required: true
        default: '40131111995'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Inspect real Stage35 evidence, not synthetic fixture
        uses: actions/download-artifact@v4
        with:
          name: rhea-stage35-reference-sizing
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.stage35_run_id || '40131111995' }}
          github-token: ${{ github.token }}
          path: input
      - name: Require actual eligible positive source-reference scenario
        id: gate
        env:
          NEAR_NETWORK: mainnet
          EXECUTION_ENABLED: 'false'
          STAGE37_SOURCE_FILE: input/stage35-sizing.json
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage37-sandbox-replay-gate-cli.ts > stage37-gate.json
          jq -e '.mode == "ARBIVANE_STAGE37_SANDBOX_READINESS" and .executionEnabled == false and .mayBroadcastMainnet == false and .transactionsExecuted == 0' stage37-gate.json
          if jq -e '.status == "VALIDATED_REFERENCE_PLAN_FOR_SANDBOX_ATTEMPT_ONLY"' stage37-gate.json >/dev/null; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'No real positive source liquidation candidate. Sandbox transaction was not attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
          jq '{status,sourceStatus,borrowerAccountId,transactionsExecuted,mainnetTradeAllowed}' stage37-gate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-stage37-replay-admission
          path: |
            stage37-gate.json
            stage37-sandbox-plan.json
          if-no-files-found: warn
          retention-days: 14
  sandbox:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && needs.preflight.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: rhea-stage35-reference-sizing
          run-id: ${{ inputs.stage35_run_id }}
          github-token: ${{ github.token }}
          path: input
      - name: Install isolated NEAR Workspaces executor
        run: npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
      - name: Attempt actual contract transaction ONLY on imported local Sandbox
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_WORKSPACES_NETWORK: sandbox
          STAGE37_ALLOW_SANDBOX_MUTATION: 'true'
          STAGE37_STAGE35_EVIDENCE_PATH: input/stage35-sizing.json
          NEAR_RPC_URL: https://archival-rpc.mainnet.fastnear.com
          NEAR_CLI_MAINNET_RPC_SERVER_URL: https://archival-rpc.mainnet.fastnear.com
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs | tee stage37-sandbox-execution.json
          jq -e '.mode == "ARBIVANE_STAGE37_SANDBOX_RESULT" and .chain == "NEAR_SANDBOX" and .realMainnetExecuted == false and .realProfitVerified == false and .mayBroadcastMainnet == false' stage37-sandbox-execution.json
          jq '{status,attemptedTransaction,receiptCount,failedReceiptCount,blockers}' stage37-sandbox-execution.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-stage37-actual-sandbox-execution
          path: stage37-sandbox-execution.json
          if-no-files-found: warn
          retention-days: 14
