name: Advisory Rhea read-only compatibility evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rhea/**'
      - 'tests/rhea-probe.test.mjs'
      - '.github/workflows/rhea-readonly-probe.yml'
permissions:
  contents: read
jobs:
  compatibility-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Public mainnet view queries only - never a transaction
        id: probe
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
        run: |
          set -o pipefail
          npm run probe:rhea | tee rhea-probe-evidence.json
      - name: Probe Pyth aggregate oracle with a public sample feed (read only; unverified Rhea mapping)
        id: aggregate
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          # This published Pyth NEAR ID is a diagnostic SAMPLE, not a confirmed Rhea mapping.
          RHEA_OPERATOR_FEED_MAPPINGS_JSON: '[{"assetId":"wrap.near","priceId":"c415de8d2efa7db216527dff4b60e8f3a5311c740dadb233e13e12547e226750"}]'
        run: |
          set -o pipefail
          npm run probe:rhea:aggregate | tee rhea-aggregate-evidence.json
      - name: Record probe outcome (advisory, not a safety approval)
        if: always()
        run: |
          echo "Legacy method probe outcome: ${{ steps.probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pyth sample feed probe outcome: ${{ steps.aggregate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pyth sample feed mapping is NOT validated against Rhea's current lending contract." >> "$GITHUB_STEP_SUMMARY"
          echo "This is RPC schema evidence only. Never infer transaction correctness or financial safety." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-mainnet-readonly-evidence
          path: |
            rhea-probe-evidence.json
            rhea-aggregate-evidence.json
          if-no-files-found: warn
          retention-days: 7
