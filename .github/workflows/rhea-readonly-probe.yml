name: Advisory Rhea read-only compatibility evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rhea/**'
      - 'tests/rhea-probe.test.mjs'
      - 'tests/rhea-market-metadata.test.mjs'
      - 'tests/rhea-coverage.test.mjs'
      - 'tests/rhea-borrower-audit.test.mjs'
      - 'tests/rhea-deployed-share-parity.test.mjs'
      - '.github/workflows/rhea-readonly-probe.yml'
permissions:
  contents: read
jobs:
  compatibility-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Public mainnet view queries only - never a transaction
        id: probe
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
        run: |
          set -o pipefail
          npm run probe:rhea | tee rhea-probe-evidence.json
      - name: Probe Pyth aggregate oracle with a public sample feed (read only; unverified Rhea mapping)
        id: aggregate
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          # A USDC Pyth feed observed in a Rhea->aggregate-oracle receipt; asset binding not independently audited.
          RHEA_OPERATOR_FEED_MAPPINGS_JSON: '[{"assetId":"a0b86991c6218b36c1d19d4a2e9eb0ce3606eb48.factory.bridge.near","priceId":"eaa020c61cc479712813461ce153894a96a6c00b21ed0cfc2798d1f9a9e9c94a"}]'
        run: |
          set -o pipefail
          npm run probe:rhea:aggregate | tee rhea-aggregate-evidence.json
      - name: Inspect lending-owned Pyth metadata (read only, advisory)
        id: metadata
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
        run: |
          set -o pipefail
          npm run probe:rhea:metadata | tee rhea-metadata-evidence.json
      - name: Inspect lending pool exposure and missing metadata (Stage 6, advisory)
        id: coverage
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
        run: |
          set -o pipefail
          npm run probe:rhea:coverage | tee rhea-coverage-evidence.json
      - name: Bounded borrower exposure sampling (Stage 7; advisory)
        id: borrowers
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_AUDIT_MAX_ACCOUNTS: '25'
          RHEA_AUDIT_PAGE_SIZE: '10'
        run: |
          set -o pipefail
          npm run probe:rhea:borrowers | tee rhea-borrower-evidence.json
      - name: Compare observed borrower balances to source pool/share math (Stage 9; advisory)
        id: share_parity
        continue-on-error: true
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_STAGE9_MAX_ACCOUNTS: '40'
          RHEA_STAGE9_PAGE_SIZE: '10'
          RHEA_STAGE9_MAX_DETAILS: '8'
        run: |
          set -o pipefail
          npm run probe:rhea:share-parity | tee rhea-share-parity-evidence.json
      - name: Record probe outcome (advisory, not a safety approval)
        if: always()
        run: |
          echo "Legacy method probe outcome: ${{ steps.probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pyth sample feed probe outcome: ${{ steps.aggregate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Lending metadata probe outcome: ${{ steps.metadata.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Stage 9 deployed share differential outcome: ${{ steps.share_parity.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Even a matching sample does NOT prove audited deployed Wasm or executable liquidation parity." >> "$GITHUB_STEP_SUMMARY"
          echo "Stage 7 borrower sample outcome: ${{ steps.borrowers.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The first N accounts are NOT a representative sample; no liquidation parity verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Stage 6 pool exposure outcome: ${{ steps.coverage.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pyth sample feed mapping is NOT validated against Rhea's current lending contract." >> "$GITHUB_STEP_SUMMARY"
          echo "This is RPC schema evidence only. Never infer transaction correctness or financial safety." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhea-mainnet-readonly-evidence
          path: |
            rhea-probe-evidence.json
            rhea-aggregate-evidence.json
            rhea-metadata-evidence.json
            rhea-coverage-evidence.json
            rhea-borrower-evidence.json
            rhea-share-parity-evidence.json
          if-no-files-found: warn
          retention-days: 7
