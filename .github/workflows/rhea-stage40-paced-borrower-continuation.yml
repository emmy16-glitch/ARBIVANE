name: Stage40 paced live borrower continuation (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rhea-stage40-paced-borrower-continuation.yml'
  workflow_dispatch:
    inputs:
      base_cursor:
        description: 'Next debt finding cursor, nonoverlapping 4 x 80 debt accounts'
        default: '652'
        required: true
      source_run_id:
        description: 'Successful Stage30 verified full mainnet source scan'
        default: '40128285853'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  discover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Download fully verified original NEAR debt registry, never guess borrowers
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40128285853' }}
          github-token: ${{ github.token }}
          path: source
      - name: Advance to four new disjoint borrower windows with paced read-only RPC
        env:
          BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.base_cursor || '652' }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^(0|[1-9][0-9]*)$ ]] || exit 2
          (( BASE >= 12 && BASE <= 7780 )) || exit 2
          echo "RHEA_STAGE38_START_FINDING=$((BASE+SHARD*80))" >> "$GITHUB_ENV"
          echo "RHEA_STAGE32_START_FINDING=$((BASE+SHARD*80))" >> "$GITHUB_ENV"
      - name: Reprice historical debt with current active-Pyth, checkpoint each 20 accounts
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE32_VERIFIED_INDEX_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE32_MAX_FINDINGS: '80'
          RHEA_STAGE32_BATCH_SIZE: '20'
          RHEA_STAGE32_CONCURRENCY: '2'
          RHEA_RPC_SPACING_MS: '700'
          RHEA_STAGE32_RESUME: 'false'
          RHEA_STAGE32_CHECKPOINT_PATH: stage32-reprice-checkpoint.json
          RHEA_STAGE32_REPORT_PATH: stage32-reprice-report.json
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/full-active-pyth-sweep-cli.ts > stage38-sweep-summary.json
          jq -e '.executionEnabled == false and .processed <= 80 and .processed == (.paperAtRisk+.paperHealthy+.noDebtNow+.blocked)' stage38-sweep-summary.json
      - name: Fresh reference-size actual candidates and attempt isolated Sandbox if any qualifies
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE38_SOURCE_RUN: '40128285853'
          RHEA_STAGE38_SOURCE_FILE: source/rhea-full-paged-index.json
          RHEA_STAGE38_STAGE32_REPORT_FILE: stage32-reprice-report.json
          RHEA_STAGE38_MAX_FINDINGS: '80'
          RHEA_RPC_SPACING_MS: '700'
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage38-live-candidate-cli.ts > stage38-summary.json
          jq -e '.mainnetExecutionEnabled == false and .maySignMainnet == false and .mayBroadcastMainnet == false and .netProfitVerified == false and .refreshed <= 16' stage38-summary.json
          jq '{startFinding,nextFinding,reviewed,paperAtRiskFromPreviousScan,refreshed,positiveSourcePlans,failedFreshReads,sandboxPlanReady}' stage38-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Only source-reference safe candidates may trigger isolated Sandbox attempts; no mainnet signing.' >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.sandboxPlanReady == true' stage38-summary.json >/dev/null; then
            test -s stage38-positive-stage35-evidence.json
            npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
            EXECUTION_ENABLED=false NEAR_WORKSPACES_NETWORK=sandbox STAGE37_ALLOW_SANDBOX_MUTATION=true \
              STAGE37_STAGE35_EVIDENCE_PATH=stage38-positive-stage35-evidence.json \
              NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com \
              NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com \
              node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage38-sandbox-actual.json
            jq -e '.chain == "NEAR_SANDBOX" and .realMainnetExecuted == false and .mayBroadcastMainnet == false' stage38-sandbox-actual.json
          else
            echo 'No fresh reference-rule-compliant candidate. NO transaction attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve scanned borrower findings, actual Sandbox result and blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-stage40-opportunity-shard-${{ matrix.shard }}
          path: |
            stage32-reprice-checkpoint.json
            stage32-reprice-report.json
            stage38-sweep-summary.json
            stage38-summary.json
            stage38-qualification.json
            stage38-positive-stage35-evidence.json
            stage38-sandbox-actual.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
            stage49-sandbox-asset-storage-preflight.json
          retention-days: 14
          if-no-files-found: warn
