name: Stage39 retry real rate-limited Rhea risk candidates (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rhea-stage39-risk-retry-to-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retry-known-risks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Recover full on-chain verified market borrower source
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: '40128285853'
          github-token: ${{ github.token }}
          path: source
      - name: Download four actual Stage38 completed screening and qualification artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rhea-stage38-opportunity-shard-*
          run-id: '40136172144'
          github-token: ${{ github.token }}
          path: shards
      - name: Retry only prior at-risk accounts blocked by actual HTTP failures; strictly serial
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE39_ORIGINAL_SCAN_RUN: '40128285853'
          RHEA_STAGE39_SOURCE_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE39_SHARDS_DIR: shards
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage39-rate-limited-risk-cli.ts > stage39-summary.json
          jq -e '.mode == "RHEA_STAGE39_RATE_LIMITED_CANDIDATE_REVALIDATION" and .chain == "NEAR_MAINNET" and .mainnetExecutionEnabled == false and .maySignMainnet == false and .mayBroadcastMainnet == false and .profitVerified == false and .attemptedFresh <= 12 and .attemptedFresh == (.blockedFresh+.noSafeScenario+.positiveSourcePlans)' stage39-summary.json
          jq '{status,attemptedFresh,noSafeScenario,blockedFresh,positiveSourcePlans,sandboxPlanReady}' stage39-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Isolated full-state Sandbox only if valid source reference plan exists
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_WORKSPACES_NETWORK: sandbox
          STAGE37_ALLOW_SANDBOX_MUTATION: 'true'
          STAGE37_STAGE35_EVIDENCE_PATH: stage39-positive-stage35-evidence.json
          NEAR_RPC_URL: https://archival-rpc.mainnet.fastnear.com
          NEAR_CLI_MAINNET_RPC_SERVER_URL: https://archival-rpc.mainnet.fastnear.com
        run: |
          set -euo pipefail
          if jq -e '.sandboxPlanReady == true' stage39-summary.json >/dev/null; then
            test -s stage39-positive-stage35-evidence.json
            npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
            node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage39-sandbox-execution.json
            jq -e '.mode == "ARBIVANE_STAGE37_SANDBOX_RESULT" and .chain == "NEAR_SANDBOX" and .realMainnetExecuted == false and .mayBroadcastMainnet == false' stage39-sandbox-execution.json
            jq '{status,attemptedTransaction,receiptCount,failedReceiptCount,blockers}' stage39-sandbox-execution.json >> "$GITHUB_STEP_SUMMARY"
          if test -s stage41-sandbox-balance-settlement.json; then jq '{status,borrowerDebtDecreaseInternal,borrowerCollateralDecreaseInternal,actorSeizeFtIncreaseAtomic,positiveNetProfitVerified}' stage41-sandbox-balance-settlement.json >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo 'No valid positive source scenario; no Sandbox transaction attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist real evidence even on Sandbox import failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-stage39-verified-rate-limit-retries
          path: |
            stage39-summary.json
            stage39-retry-evidence.json
            stage39-positive-stage35-evidence.json
            stage39-sandbox-execution.json
            stage37-sandbox-execution.json

            stage41-sandbox-balance-settlement.json
          retention-days: 14
          if-no-files-found: warn
