name: NEAR Rhea full market debt index (read only)
on:
  workflow_dispatch:
    inputs:
      from_index:
        description: 'Start index for a partial same-block window'
        required: true
        default: '0'
      max_accounts:
        description: 'Accounts to scan (up to 250000; current Rhea account count is much lower)'
        required: true
        default: '100000'
      resume_run_id:
        description: 'Optional previous full-market workflow run ID to resume exactly the same block'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  full-market-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Recover previous GitHub Actions checkpoint (optional, same NEAR block only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: near-rhea-debt-index-readonly
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Full NEAR mainnet Rhea account index at ONE finalized block (views only)
        id: backfill
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_BACKFILL_FROM_INDEX: ${{ github.event_name == 'workflow_dispatch' && inputs.from_index || '0' }}
          RHEA_BACKFILL_MAX_ACCOUNTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_accounts || '100000' }}
          RHEA_BACKFILL_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
          RHEA_BACKFILL_PAGE_SIZE: '50'
          RHEA_BACKFILL_CONCURRENCY: '2'
          RHEA_BACKFILL_BATCH_DELAY_MS: '1250'
          # Less than 2 page requests per second, with shared throttle and Retry-After support.
          RHEA_BACKFILL_MAX_RETRIES: '7'
          RHEA_BACKFILL_RATE_LIMIT_DELAY_MS: '5000'
          RHEA_BACKFILL_CHECKPOINT_PATH: output/rhea-debt-index.checkpoint.json
          RHEA_BACKFILL_REPORT_PATH: output/rhea-debt-index.report.json
        run: |
          set -euo pipefail
          node --version
          npm run probe:rhea:full-debt-index | tee output-summary.json
      - name: Publish actual outcome, never imply profitable positions
        if: always()
        run: |
          echo "Full index probe: ${{ steps.backfill.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output-summary.json ]; then
            echo 'Read the report JSON for actual counts, block height, missing schemas and completion.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No complete summary was produced. Inspect the checkpoint, logs, and errors.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'For a failed run, manually use workflow_dispatch resume_run_id and the SAME from_index/max_accounts; historical NEAR block availability is required.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Borrowed shares are NOT liquidatable positions. Execution and price parity remain disabled.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-rhea-debt-index-readonly
          path: |
            output/rhea-debt-index.checkpoint.json
            output/rhea-debt-index.report.json
            output-summary.json
          if-no-files-found: warn
          retention-days: 7
