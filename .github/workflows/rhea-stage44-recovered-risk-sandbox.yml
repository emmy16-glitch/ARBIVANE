name: Stage44 recovered Rhea risk to isolated Sandbox preflight
on:
  workflow_run:
    workflows:
      - Stage43 retry blocked reconciled Rhea observations (read only)
    types: [completed]
  workflow_dispatch:
    inputs:
      stage43_run_id:
        description: 'Successful Stage43 read-only retry run holding its verified report'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: arbivane-stage44-source-sizing
  cancel-in-progress: false
jobs:
  verify-and-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Load exact Stage30 verified historic borrower identities
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: '40128285853'
          github-token: ${{ github.token }}
          path: source
      - name: Load this completed Stage43 retry report only
        uses: actions/download-artifact@v4
        with:
          name: rhea-stage43-targeted-blocked-retry
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.stage43_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: stage43
      - name: Fresh Stage35 sizing ONLY for verified Stage43 paper-risk recoveries
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE44_STAGE43_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.stage43_run_id || github.event.workflow_run.id }}
          RHEA_STAGE44_SOURCE_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE44_STAGE43_REPORT_PATH: stage43/stage43-blocked-retry.json
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage44-recovered-risk-sandbox-preflight-cli.ts > stage44-summary.json
          jq -e '.mode == "RHEA_STAGE44_RECOVERED_RISK_SANDBOX_PREFLIGHT" and
            .chain == "NEAR_MAINNET" and
            .attemptedFreshSizing == .recoveredPaperRiskTargets and
            .attemptedFreshSizing == (.sourcePositivePlans + .noSafeSourceScenario + .blockedFreshSizing) and
            .recoveredPaperRiskTargets <= 12 and
            .mainnetExecutionEnabled == false and
            .maySignMainnet == false and
            .mayBroadcastMainnet == false and
            .liquidationEligibilityVerified == false and
            .netProfitVerified == false and
            .walletApproved == false and
            .completeMarketScreened == false' stage44-summary.json
          jq -e '. as $r | (.rows | length) == $r.attemptedFreshSizing and
            all(.rows[]; .mainnetExecutionEligible == false and .netProfitVerified == false)' stage44-recovered-risk-report.json
          jq '{status,recoveredPaperRiskTargets,attemptedFreshSizing,sourcePositivePlans,noSafeSourceScenario,blockedFreshSizing,sandboxPlanReady}' stage44-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo 'A reference-only spread is not current deployed liquidation permission or realized net profit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run actual LOCAL Sandbox liquidation route only for verified reference-positive plan
        if: success()
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_WORKSPACES_NETWORK: sandbox
        run: |
          set -euo pipefail
          if jq -e '.sandboxPlanReady == true' stage44-summary.json >/dev/null; then
            test -s stage44-positive-stage35-evidence.json
            npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
            EXECUTION_ENABLED=false NEAR_WORKSPACES_NETWORK=sandbox STAGE37_ALLOW_SANDBOX_MUTATION=true \
              STAGE37_STAGE35_EVIDENCE_PATH=stage44-positive-stage35-evidence.json \
              NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com \
              NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com \
              node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage44-sandbox-actual.json
            jq -e '.chain == "NEAR_SANDBOX" and .realMainnetExecuted == false and .mayBroadcastMainnet == false' stage44-sandbox-actual.json
          else
            echo 'No positive source-only plan; no Sandbox transaction attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reference sizing, blockers and only authentic Sandbox receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-stage44-recovered-risk-sandbox-evidence
          path: |
            stage44-summary.json
            stage44-recovered-risk-report.json
            stage44-positive-stage35-evidence.json
            stage44-sandbox-actual.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
            stage49-sandbox-asset-storage-preflight.json
          retention-days: 14
          if-no-files-found: warn
