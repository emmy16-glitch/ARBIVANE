name: Stage43 retry blocked reconciled Rhea observations (read only)
on:
  workflow_run:
    workflows:
      - Stage42 verified Rhea borrower continuation (read only)
    types: [completed]
  workflow_dispatch:
    inputs:
      stage42_run_id:
        description: 'Successful Stage42 run containing all four shards and reconciled window'
        required: true
      base_cursor:
        description: 'Exact historic debt cursor of the Stage42 run'
        required: true
        default: '1292'
      from_target:
        description: 'Retry target cursor (not original debt finding index)'
        required: true
        default: '0'
permissions:
  contents: read
  actions: write
concurrency:
  group: arbivane-stage43-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.stage42_run_id }}
  cancel-in-progress: false
jobs:
  retry-failed-observations:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Download verified historical Rhea debt index, pinned to original full scan
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: '40128285853'
          github-token: ${{ github.token }}
          path: source
      - name: Download exactly reconciled Stage42 aggregate from selected workflow run
        uses: actions/download-artifact@v4
        with:
          name: rhea-stage42-reconciled-window
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.stage42_run_id }}
          github-token: ${{ github.token }}
          path: aggregate
      - name: Download original four Stage42 borrower shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: rhea-stage42-opportunity-shard-*
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.stage42_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: false
          path: shards
      - name: Derive and attest the exact borrower window from this Stage42 run
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          STAGE47_MANUAL_EXPECTED_CURSOR: ${{ github.event_name == 'workflow_dispatch' && inputs.base_cursor || '' }}
        run: |
          set -euo pipefail
          base=$(node scripts/stage47-stage43-cursor-cli.mjs aggregate/stage42-reconciled-window.json)
          [[ "$base" =~ ^[0-9]+$ ]] || exit 2
          echo "RHEA_STAGE43_BASE_CURSOR=$base" >> "$GITHUB_ENV"
          echo "Verified parent Stage42 borrower cursor: $base" >> "$GITHUB_STEP_SUMMARY"
      - name: Retry at most 12 authentic unresolved observations on one current finalized block
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE43_PARENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.stage42_run_id }}
          RHEA_STAGE43_SOURCE_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE43_SHARDS_DIR: shards
          RHEA_STAGE43_RECONCILED_PATH: aggregate/stage42-reconciled-window.json
          RHEA_STAGE43_FROM_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.from_target || '0' }}
          RHEA_STAGE43_MAX_TARGETS: '12'
          RHEA_RPC_SPACING_MS: '900'
          RHEA_STAGE43_REPORT_PATH: stage43-blocked-retry.json
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage43-blocked-observation-retry-cli.ts > stage43-summary.json
          jq -e '.mode == "RHEA_STAGE43_RECONCILED_BLOCKED_OBSERVATION_RETRY" and
            .chain == "NEAR_MAINNET" and
            .executionEnabled == false and .maySignMainnet == false and
            .mayBroadcastMainnet == false and .positiveNetProfitVerified == false and
            .deployedLiquidationParityVerified == false and
            .transactionReplayVerified == false and
            .processed <= 12 and .targetCount == (.nextTarget + .remainingTargets) and
            .processed == (.nextTarget - .fromTarget) and
            .processed == (.paperHealthy+.paperAtRiskNeedsSizing+.noDebtNow+.stillBlocked)' stage43-summary.json
          jq -e '. as $r | all(.observations[]; .executionEligible == false and
            .netProfitVerified == false and
            ((.status == "STILL_BLOCKED") or .freshBlockHeight == $r.currentPricingBlockHeight))' stage43-blocked-retry.json
          jq -r '"Original blocked targets: "+(.targetCount|tostring)+
            "; retried this batch: "+(.processed|tostring)+
            "; still blocked: "+(.stillBlocked|tostring)+
            "; paper risk requiring fresh source sizing: "+(.paperAtRiskNeedsSizing|tostring)+
            "; next retry cursor: "+(.nextTarget|tostring)+
            "; remaining targets: "+(.remainingTargets|tostring)' stage43-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo 'NO MAINNET TRADING. Paper health and reference spreads are not deployed liquidation eligibility or net profit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify recovered at-risk borrowers and attempt actual gated Rhea Sandbox liquidation
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE43_SOURCE_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE43_SHARDS_DIR: shards
          RHEA_STAGE43_RECONCILED_PATH: aggregate/stage42-reconciled-window.json
          RHEA_STAGE61_STAGE43_REPORT_PATH: stage43-blocked-retry.json
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage61-recovered-risk-cli.ts > stage61-summary.json
          jq -e '.mode == "RHEA_STAGE61_RECOVERED_RISK_TO_SANDBOX" and
            .mainnetExecutionEnabled == false and .maySignMainnet == false and
            .mayBroadcastMainnet == false and .realProfitVerified == false and
            .sandboxReplaySucceeded == false and .attemptedFresh == .recoveredPaperRisk and
            .attemptedFresh <= 12 and .positiveSourcePlans <= .attemptedFresh' stage61-summary.json
          jq '{recoveredPaperRisk,attemptedFresh,blockedFresh,positiveSourcePlans,sandboxPlanReady}' stage61-summary.json >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.sandboxPlanReady == true' stage61-summary.json >/dev/null; then
            test -s stage61-positive-stage35-evidence.json
            npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
            sandbox_exit=0
            if EXECUTION_ENABLED=false NEAR_WORKSPACES_NETWORK=sandbox STAGE37_ALLOW_SANDBOX_MUTATION=true STAGE49_ALLOW_SANDBOX_WRAP_NEAR_FUNDING=true \
              STAGE37_STAGE35_EVIDENCE_PATH=stage61-positive-stage35-evidence.json \
              NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com \
              NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com \
              node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage61-sandbox-actual.json; then
              sandbox_exit=0
            else
              sandbox_exit=$?
            fi
            EXECUTION_ENABLED=false NEAR_NETWORK=mainnet \
              node scripts/stage56-sandbox-attempt-cli.mjs "$sandbox_exit" \
                stage61-sandbox-actual.json stage55-sandbox-phase-evidence.json \
                stage37-sandbox-execution.json stage41-sandbox-balance-settlement.json \
                > stage61-sandbox-attempt-stdout.json
            jq -e '.mode == "ARBIVANE_STAGE56_EVIDENCED_SANDBOX_ATTEMPT" and
              .chain == "NEAR_SANDBOX" and .readOnlyMarketContinuationAllowed == true and
              .realMainnetExecuted == false and .realProfitVerified == false and
              .mayBroadcastMainnet == false and .maySignMainnet == false' stage56-sandbox-attempt-evidence.json
            jq '{status,currentPhase,observedFailureCode,localLiquidationCallInvoked,actualRheaSettlementVerified}' stage56-sandbox-attempt-evidence.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No current reference-safe recovered borrower; no Sandbox transaction attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Dispatch the remaining authentic blocked targets in bounded 12-item batches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_STAGE42_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.stage42_run_id }}
        run: |
          set -euo pipefail
          jq -e '. as $r | .processed <= 12 and .fromTarget >= 0 and
            .remainingTargets >= 0 and .targetCount <= 320 and
            .nextTarget == (.fromTarget + .processed) and
            .targetCount == (.nextTarget + .remainingTargets) and
            .executionEnabled == false and .mayBroadcastMainnet == false and
            .positiveNetProfitVerified == false' stage43-blocked-retry.json
          if jq -e '.remainingTargets > 0' stage43-blocked-retry.json >/dev/null; then
            next=$(jq -r '.nextTarget' stage43-blocked-retry.json)
            [[ "$next" =~ ^[0-9]+$ ]] && (( next > 0 && next <= 320 )) || exit 2
            [[ "$PARENT_STAGE42_RUN_ID" =~ ^[0-9]{7,}$ ]] || exit 2
            [[ "$RHEA_STAGE43_BASE_CURSOR" =~ ^[0-9]+$ ]] || exit 2
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/rhea-stage43-blocked-retry.yml/dispatches" \
              -f ref=main -f "inputs[stage42_run_id]=$PARENT_STAGE42_RUN_ID" \
              -f "inputs[base_cursor]=$RHEA_STAGE43_BASE_CURSOR" \
              -f "inputs[from_target]=$next"
            echo "Queued next verified blocked-target retry batch at target index $next" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve durable retry evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-stage43-targeted-blocked-retry
          path: |
            stage43-blocked-retry.json
            stage43-summary.json
            stage61-summary.json
            stage61-recovered-source-evidence.json
            stage61-positive-stage35-evidence.json
            stage61-sandbox-actual.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
            stage55-sandbox-phase-evidence.json
            stage56-sandbox-attempt-evidence.json
            stage61-sandbox-attempt-stdout.json
            stage46-sandbox-clone-evidence.json
            stage49-sandbox-route-preflight.json
            stage49-sandbox-registration.json
            stage49-sandbox-funding.json
            stage50-pinned-repay-reserve.json
            stage51-active-pyth-sandbox-parity.json
            stage52-actor-borrow-capacity.json
          retention-days: 14
          if-no-files-found: warn
