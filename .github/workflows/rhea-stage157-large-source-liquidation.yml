name: Stage157 source-sized large Rhea liquidation (Sandbox only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/stage157-large-source-admission.mjs'
      - 'tests/rhea-stage157-large-source-admission.test.mjs'
      - '.github/workflows/rhea-stage157-large-source-liquidation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: arbivane-stage157-large-source-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      # Non-overlapping historic indexed LiNEAR debt hot spots.
      # They are NOT assumed underwater or large: actual fresh Pyth + original
      # lending rules and source-sized USD gates independently decide admission.
      matrix:
        include:
          - {shard: 0, start: 2537}
          - {shard: 1, start: 4989}
          - {shard: 2, start: 7671}
          - {shard: 3, start: 2986}
    env:
      EXECUTION_ENABLED: 'false'
      NEAR_NETWORK: mainnet
      NEAR_WORKSPACES_NETWORK: sandbox
      NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
      NEAR_RPC_FALLBACK_URL: https://rpc.mainnet.near.org
      RHEA_LENDING_CONTRACT: contract.main.burrow.near
      RHEA_ORACLE_CONTRACT: aggregate-oracle.near
      RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
      RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
      RHEA_STAGE32_VERIFIED_INDEX_PATH: source/rhea-full-paged-index.json
      RHEA_STAGE32_MAX_FINDINGS: '80'
      RHEA_STAGE32_BATCH_SIZE: '20'
      RHEA_STAGE32_CONCURRENCY: '2'
      RHEA_STAGE32_RESUME: 'false'
      RHEA_RPC_SPACING_MS: '900'
      RHEA_STAGE32_CHECKPOINT_PATH: stage32-reprice-checkpoint.json
      RHEA_STAGE32_REPORT_PATH: stage32-reprice-report.json
      RHEA_STAGE38_SOURCE_RUN: '40128285853'
      RHEA_STAGE38_SOURCE_FILE: source/rhea-full-paged-index.json
      RHEA_STAGE38_STAGE32_REPORT_FILE: stage32-reprice-report.json
      RHEA_STAGE38_MAX_FINDINGS: '80'
      # Filter SMALL source discount before allowing paper candidates.
      # This is NOT proof of real profit, oracle parity, or capital-free lending.
      RHEA_STAGE38_SANDBOX_MIN_PAPER_GROSS_USD_E27: '5000000000000000000000000000'
      STAGE157_MIN_GROSS_USD_E27: '5000000000000000000000000000'
      STAGE157_MIN_REPAY_USD_E27: '500000000000000000000000000000'
      STAGE157_QUALIFICATION_PATH: stage38-qualification.json
      STAGE157_ADMISSION_PATH: stage157-large-source-admission.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify authentic complete immutable Rhea borrower registry
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: '40128285853'
          github-token: ${{ github.token }}
          path: source
      - name: Prove source finding range and prevent mainnet execution
        shell: bash
        env:
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          jq -e '.mode=="RHEA_COMPLETE_PAGED_INDEX_ATTESTATION" and .chain=="NEAR_MAINNET" and
            .completeSnapshot==true and .debtAccounts==7801 and .scannedAccounts==72782 and
            .lendingCodeHash=="6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa" and
            .executionEnabled==false and (.findings|length)==7801' source/rhea-full-paged-index.json
          [[ "$START" =~ ^[0-9]+$ ]] && (( START >= 0 && START+80 <= 7801 ))
          echo "RHEA_STAGE32_START_FINDING=$START" >> "$GITHUB_ENV"
          echo "RHEA_STAGE38_START_FINDING=$START" >> "$GITHUB_ENV"
          jq -n --argjson start "$START" --argjson shard ${{ matrix.shard }}             '{mode:"STAGE157_AUTHENTIC_SOURCE_DEBT_WINDOW",startFinding:$start,count:80,shard:$shard,
              executionEnabled:false,profitVerified:false}' > stage157-source-window.json
      - name: Fresh same-block deployed Pyth health checks, only public chain reads
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/full-active-pyth-sweep-cli.ts > stage157-sweep-summary.json
          jq -e '.executionEnabled==false and .maySign==false and .mayBroadcast==false and
            .processed==80 and .processed==(.paperAtRisk+.paperHealthy+.noDebtNow+.blocked)' stage157-sweep-summary.json
      - name: Requalify true source-sized risk and gate the minimum large liquidation
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage38-live-candidate-cli.ts > stage157-qualification-summary.json
          jq -e '.mainnetExecutionEnabled==false and .maySignMainnet==false and
            .mayBroadcastMainnet==false and .reviewed==80 and
            .refreshed==.paperAtRiskFromPreviousScan' stage157-qualification-summary.json
          node scripts/stage157-large-source-admission.mjs > stage157-admission-summary.json
          jq -e '.mode=="STAGE157_SOURCE_ATTESTED_LARGE_LIQUIDATION_ADMISSION" and
            .chain=="NEAR_SANDBOX" and .maySignMainnet==false and .executionEnabled==false and
            .actualOriginalSettlementVerified==false and .actualMainnetProfitVerified==false' stage157-large-source-admission.json
          jq -c '{status,blocker,sourceFindingRange,sourceRepayReferenceUsdE27,
            sourcePaperGrossUsdE27,sourceSizeLargeEnoughForSandbox}' stage157-large-source-admission.json
      - name: Execute genuinely source-sized liquidation in isolated Sandbox only if admitted
        shell: bash
        env:
          SANDBOX_ARTIFACT_URL: https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.13.4/near-sandbox.tar.gz
          STAGE37_ALLOW_SANDBOX_MUTATION: 'true'
          STAGE49_ALLOW_SANDBOX_WRAP_NEAR_FUNDING: 'true'
          STAGE82_SINGLE_BORROWER: 'true'
          STAGE37_STAGE35_EVIDENCE_PATH: stage38-positive-stage35-evidence.json
          STAGE45_ARCHIVAL_FALLBACK_URL: ${{ secrets.ARBIVANE_LARGE_STATE_ARCHIVAL_RPC_URL || 'https://archival-rpc.mainnet.near.org' }}
        run: |
          set -euo pipefail
          if ! jq -e '.sourceSizeLargeEnoughForSandbox==true' stage157-large-source-admission.json >/dev/null; then
            echo 'No genuinely LARGE fresh source liquidatable position in this window; NO transaction submitted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s stage38-positive-stage35-evidence.json
          jq -e '.referenceRulesPass==true and .executionEnabled==false and
            .maySign==false and .mayBroadcast==false and
            .repay.tokenId=="linear-protocol.near" and .seize.tokenId=="linear-protocol.near"' stage38-positive-stage35-evidence.json
          npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
          export NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com
          export NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com
          timeout --kill-after=10s 18m node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage157-sandbox-runner.log 2> stage157-sandbox-stderr.log
          test -s stage37-process-result.json
          # Executed local Rhea contract alone is not enough; require actual
          # final receipts plus independently checked borrower and actor deltas.
          jq -e '.status=="LOCAL_RHEA_BALANCE_AND_CALLBACK_VERIFIED_NOT_PROFIT" and
            .localLiquidationCallInvoked==true and .actualRheaSettlementVerified==true' stage55-sandbox-phase-evidence.json
          jq -e '.status=="ISOLATED_CALLBACK_SUCCESS_NOT_MAINNET_PROOF" and
            .attemptedTransaction==true and .failedReceiptCount==0 and
            .callbackReceiptCount>0 and .failedCallbackReceiptCount==0' stage37-sandbox-execution.json
          jq -e '.status=="POSITION_AND_FT_DELTAS_OBSERVED_UNSOLD" and
            .borrowerMutationVerified==true and .assetTransferObserved==true and
            .borrowerDebtDecreaseInternal!="0" and
            .borrowerCollateralDecreaseInternal!="0" and
            .actorSeizeFtIncreaseAtomic!="0"' stage41-sandbox-balance-settlement.json
          echo 'Genuine SOURCE-SIZED LARGE liquidation Sandbox receipts and balance deltas passed; no real profit or mainnet trade.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive even the failed and ineligible original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage157-authentic-large-source-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            stage157-source-window.json
            stage157-sweep-summary.json
            stage32-reprice-report.json
            stage32-reprice-checkpoint.json
            stage157-qualification-summary.json
            stage38-qualification.json
            stage38-positive-stage35-evidence.json
            stage157-large-source-admission.json
            stage157-admission-summary.json
            stage157-sandbox-runner.log
            stage157-sandbox-stderr.log
            stage37-process-result.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
            stage55-sandbox-phase-evidence.json
            stage49-sandbox-route-preflight.json
            stage51-active-pyth-sandbox-parity.json
            stage115-historical-clock.json
            stage116-signed-transaction.json
            stage129-final-rhea-receipts.json
