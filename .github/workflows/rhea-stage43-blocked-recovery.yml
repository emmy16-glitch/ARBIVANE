name: Stage43 recover blocked Rhea evidence (read only)
on:
  workflow_run:
    workflows:
      - Stage42 verified Rhea borrower continuation (read only)
    types: [completed]
  workflow_dispatch:
    inputs:
      stage42_run_id:
        description: 'Completed successful Stage42 workflow run with all four shards reconciled'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: arbivane-stage43-blocked-recovery
  cancel-in-progress: false
jobs:
  recover-blocked:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Fetch independently verified historical Rhea account registry
        uses: actions/download-artifact@v4
        with:
          name: rhea-full-paged-verified-market
          run-id: '40128285853'
          github-token: ${{ github.token }}
          path: source
      - name: Fetch completed Stage42 aggregate attestation
        uses: actions/download-artifact@v4
        with:
          name: rhea-stage42-reconciled-window
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.stage42_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: reconciled
      - name: Fetch all four Stage42 source evidence shards
        uses: actions/download-artifact@v4
        with:
          pattern: rhea-stage42-opportunity-shard-*
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.stage42_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: shards
          merge-multiple: false
      - name: Retry only authenticated blocked observations against fresh Rhea state
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_NETWORK: mainnet
          NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
          RHEA_LENDING_CONTRACT: contract.main.burrow.near
          RHEA_ORACLE_CONTRACT: aggregate-oracle.near
          RHEA_EXPECTED_LENDING_CODE_HASH: 6Nek1MZ8cwJJ2xMQAUWup9V5AToYS9rkTxJfwo6BCpFa
          RHEA_EXPECTED_ORACLE_CODE_HASH: 9vafnXzrPYQ4ErDqt2triRkQJHdxtG7tfkyb24t5Ttrg
          RHEA_STAGE43_STAGE42_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.stage42_run_id || github.event.workflow_run.id }}
          RHEA_STAGE43_SOURCE_PATH: source/rhea-full-paged-index.json
          RHEA_STAGE43_SHARDS_DIR: shards
          RHEA_STAGE43_STAGE42_REPORT_PATH: reconciled/stage42-reconciled-window.json
          RHEA_STAGE43_RPC_SPACING_MS: '1000'
          RHEA_STAGE43_ACCOUNT_DELAY_MS: '1500'
        run: |
          set -euo pipefail
          node --experimental-strip-types src/rhea/stage43-blocked-evidence-recovery-cli.ts > stage43-summary.json
          jq -e '.mode == "RHEA_STAGE43_RECOVER_BLOCKED_BORROWER_EVIDENCE" and .chain == "NEAR_MAINNET" and .attemptedFresh == .targets and .targets == (.previouslyBlockedPricing + .previouslyBlockedRiskRechecks) and .recovered + .stillBlocked == .targets and .mainnetExecutionEnabled == false and .maySignMainnet == false and .mayBroadcastMainnet == false and .realNetProfitVerified == false and .liquidationEligibilityVerified == false and .allMarketBorrowersRepriced == false' stage43-summary.json
          jq -e '. as $report | (.rows | length) == $report.targets and all(.rows[]; .executionEligible == false and .netProfitVerified == false)' stage43-retry-report.json
          jq '{status,originalWindowVisited,targets,recovered,stillBlocked,nowHealthy,noDebtNow,noSafeSourceScenario,positiveSourcePlans,sandboxPlanReady}' stage43-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Borrower reference health and gross spreads are not verified mainnet liquidation eligibility or net profit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Actual isolated Sandbox replay ONLY for independently admitted positive source plan
        if: success()
        env:
          EXECUTION_ENABLED: 'false'
          NEAR_WORKSPACES_NETWORK: sandbox
        run: |
          set -euo pipefail
          if jq -e '.sandboxPlanReady == true' stage43-summary.json > /dev/null; then
            test -s stage43-positive-stage35-evidence.json
            npm install --no-save --ignore-scripts --no-audit --no-fund near-workspaces@5.0.0
            EXECUTION_ENABLED=false NEAR_WORKSPACES_NETWORK=sandbox STAGE37_ALLOW_SANDBOX_MUTATION=true \
              STAGE37_STAGE35_EVIDENCE_PATH=stage43-positive-stage35-evidence.json \
              NEAR_RPC_URL=https://archival-rpc.mainnet.fastnear.com \
              NEAR_CLI_MAINNET_RPC_SERVER_URL=https://archival-rpc.mainnet.fastnear.com \
              node --experimental-strip-types scripts/stage37-workspaces-sandbox-replay.mjs > stage43-sandbox-actual.json
            jq -e '.chain == "NEAR_SANDBOX" and .realMainnetExecuted == false and .mayBroadcastMainnet == false' stage43-sandbox-actual.json
          else
            echo 'No positive reference source plan; no Sandbox transaction attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save actual retry results, failures and optional Sandbox receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhea-stage43-blocked-recovery
          path: |
            stage43-summary.json
            stage43-retry-report.json
            stage43-progress.jsonl
            stage43-positive-stage35-evidence.json
            stage43-sandbox-actual.json
            stage37-sandbox-execution.json
            stage41-sandbox-balance-settlement.json
          retention-days: 14
          if-no-files-found: warn
